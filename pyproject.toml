[tool.poetry]
name = "python-backend-cdk"
version = "0.1.0"
description = ""
authors = ["Admin <admin@example.com>"]

[tool.poetry.dependencies]
# CDK
aws-cdk-lib = ">=2.164.1"
constructs = ">=10.0.0"
cdk-nag = ">2.0.0"
cdk-monitoring-constructs = "*"
python = "^3.12"
pydantic = ">2.0"
aws-cdk-aws-lambda-python-alpha = "^2.150.0a0"
toml = "^0.10.2"
anthropic = "^0.49.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
pre-commit = "^3.6.2"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.mypy]
strict = true
exclude = ["venv", "alembic"]
