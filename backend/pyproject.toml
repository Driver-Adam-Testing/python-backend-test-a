[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Admin <admin@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
uvicorn = {extras = ["standard"], version = "^0.24.0.post1"}
fastapi = "^0.115.4"
python-multipart = "^0.0.7"
email-validator = "^2.1.0.post1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
tenacity = "^8.2.3"
pydantic = ">2.0"

#TODO: Do we need gunicorn?
gunicorn = "^22.0.0"
jinja2 = "^3.1.2"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
httpx = "^0.25.1"

# Pin bcrypt until passlib supports the latest
bcrypt = "4.0.1"
pydantic-settings = "^2.2.1"
database = {path = "../driver_db", develop = true}
shared = {path = "../packages/shared", develop = true}
strawberry-graphql = {extras = ["fastapi"], version = "^0.230.0"}
auth0-python = "^4.7.1"
boto3 = "^1.34.114"
moto = "^5.0.9"
aws-cdk-lib = "^2.144.0"
constructs = "^10.3.0"
openai = "^1.35.12"
tiktoken = "^0.7.0"
modal = "^0.64.121"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
pre-commit = "^3.6.2"
pytest-mock = "^3.12.0"
types-python-jose = "^3.3.4.20240106"
types-passlib = "^1.7.7.20240106"
fastapi-cli = "^0.0.4"


[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.mypy]
strict = true
exclude = ["venv", "alembic"]

[tool.pytest.ini_options]
markers = [
    "unit"
]
addopts = "--cov --cov-report=term-missing --cov-report=xml:coverage/coverage.xml"

[tool.coverage]
omit = [
    "**/*_test.py",
    "**/tests/**",
]
