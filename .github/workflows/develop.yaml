  ops:
    # needs: unittest
    runs-on: ubuntu-latest
    environment: ops
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm i -g aws-cdk
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::058264523856:role/V2BaseInfrastructureStack-BaseInfrastructureCICDRol-iFv3DUSRZEMS
      - name: CDK Synth
        env:
          DEPLOYMENT_ENVIRONMENT: development
        run: cdk synth > template.yaml
      - name: Archive generated CloudFormation template
        uses: actions/upload-artifact@v4
        with:
          name: CloudFormation Template
          path: template.yaml
      - name: CDK Deploy
        env:
          DEPLOYMENT_ENVIRONMENT: ops
        run: cdk deploy 058264523856 us-east-1 "$@" --require-approval never
