[project]
name = "metrics-handler"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34.130",
    "httpx>=0.28.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.3",
    "aws-secretsmanager-caching>=1.1.3",
    "setuptools>=78.1.1",
    "database",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "moto[all,ec2,s3]>=5.0.9",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utils"]

[tool.uv.sources]
database = { workspace = true }

[tool.poetry]
name = "metrics-handler"
version = "0.1.0"
description = ""
authors = ["Eric Miller <146128069+eric-driverai@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "utils", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
database = { path = "../../packages/driver_db", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
moto = {extras = ["all", "ec2", "s3"], version = "^5.0.9"}
pytest-mock = "^3.14.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
