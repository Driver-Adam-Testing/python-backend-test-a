[[sections]]
title = "Supported Evaluation Boards"
level = 1
required = true
instruction = """List each of the following evaluation boards:
    {DEVICE_EVAL_BOARD}
List each as a hyperlink to the corresponding product webpage if it can be found in the board user guide or data sheet.  Do not include a hyperlink if an exact web address can't be determined."""
content_structure = "List each board as a bullet point list with a hyperlink to the corresponding product webpage if it can be found in the board user guide or data sheet.  Do not include a hyperlink if an exact web address can't be determined."
section_creation_method = "scatter_gather"

[[sections]]
title = "Overview"
level = 1
required = true
instruction = "Summarize the 'GENERAL DESCRIPTION' section from the {DEVICE_EVAL_BOARD} user guide in a single paragraph."
content_structure = "Summarize the 'GENERAL DESCRIPTION' section from the {DEVICE_EVAL_BOARD} user guide in a single paragraph."
section_creation_method = "scatter_gather"

[[sections]]
title = "Applications"
level = 1
required = true
instruction = "Provide only a list of the applications supported by the {DEVICE} described in the data sheet. Exactly copy the content from any sections named 'Applications', if an 'Applications' section does not exist in the content provided, simply respond 'No applications found for this content'. The Applications section you copy will just be a list, if that doesn't exist just return 'No applications found for this content'.  Do not include content from sections that are not exactly titled 'Applications'"
content_structure = "Provide only an unordered list of the applications supported by the {DEVICE}. Just the list with no descriptions. Do not edit the content in this section, beyond making sure the list is well formatted."
section_creation_method = "scatter_gather"

[[sections]]
title = "Hardware Specifications"
level = 1
required = true
instruction = "This section should be empty"
content_structure = "Only the section heading and no other content"
section_creation_method = "scatter_gather"

[[sections]]
title = "Power Supply Requirements"
level = 2
required = true
instruction = "Detail the power supply requirements that apply to the {DEVICE_EVAL_BOARD} board. Include voltage ranges, current ratings, and any special considerations. This should focus on what's needed to power the board, not the internal power requirements of the {DEVICE}.  Mention the board by name.  This information should come from the {DEVICE_EVAL_BOARD} user manual or data sheet."
content_structure = "A table of specific voltage/current requirements preceded by a single sentence introducing the table.  The introduction sentence should mention the {DEVICE_EVAL_BOARD} board by name.  Include no other content beyond the introductory sentence and the table(s)."
section_creation_method = "scatter_gather"

[[sections]]
title = "Jumper Settings"
level = 2
required = false
instruction = "Describe the jumper settings for the {DEVICE_EVAL_BOARD}.  Include information about default jumper positions, what they control, and any configuration options available through jumpers or switches.  Mention the board by name.  It is possible that the board doesn't use jumpers in which case this information can be omitted.  This information should come from the {DEVICE_EVAL_BOARD} user manual or data sheet and should not reference the source code."
content_structure = "One or more tables showing jumper settings and their effects.  The table(s) should be preceded by a single sentence describing the purpose of the tables.  This sentence should mention the {DEVICE_EVAL_BOARD} by name.  Include no other content beyond the introductory sentence and the table(s)."
section_creation_method = "scatter_gather"

[[sections]]
title = "Pin Description"
level = 2
required = true
instruction = "Provide detailed descriptions of the pins on key connectors of the {DEVICE_EVAL_BOARD}. Include pin numbers, names, and functions for each connector. Describe only the {DEVICE_EVAL_BOARD} board connectors that users will interact with, not the internal pins of the {DEVICE} itself.  Mention the {DEVICE_EVAL_BOARD} board by name.  Use only the {DEVICE_EVAL_BOARD} user guide as a source of information and do not include any platform specific details.  The description should be a short sentence or two describing the function of the pin."
content_structure = "Organize the list of pins and related attributes in one or more tables.  The table(s) should include the following columns: Pin Number, Pin Name, Pin Function, and Description.  If a pin is not used, it should be marked as 'Not Used' in the table.  The table(s) should be preceded by a single sentence describing the purpose of the table(s).  This sentence should mention the {DEVICE_EVAL_BOARD} by name.  Include no other content beyond the introductory sentence and the table(s)."
section_creation_method = "scatter_gather"

[[sections]]
title = "No-OS Build Setup"
level = 1
required = true
instruction = "Include only the exact text: 'Please see: https://wiki.analog.com/resources/no-os/build' for this section."
content_structure = "A single line of text with a link to the No-OS build wiki page."
section_creation_method = "scatter_gather"

[[sections]]
title = "No-OS Supported Examples"
level = 1
required = true
instruction = "Provide an overview for each example in the examples directory of the code. First explain where initialization data can be found in the project directory (typically Project Common Data Path) and where the platform specific macros are defined in the code (typically in platform specific files). Then identify all examples that exist in the project's example directory. For each example found, create a subsection that: 1) Describes what the example does and what functionality it demonstrates, 2) Explains how to enable/select the example by setting variables in the Makefile."
content_structure = """Start with an brief introductory paragraph about where example initialization data is found and where macros are defined.  This paragraph should take the following form:

'The initialization data used in the examples is taken out from: <Project Common Data Path>
The macros used in Common Data are defined in platform specific files found in: <Project Platform Configuration Path>'

Then include subsections (level 2 headings) for each specific example found in the project's example directory. Each example subsection should have 1-2 sentences of description followed by a code block showing how to enable that example and disable the other examples."""
section_creation_method = "sequential_edit"

[[sections]]
title = "No-OS Supported Platforms"
level = 1
required = true
instruction = "This section should be empty"
content_structure = "Only the section heading and no other content"
section_creation_method = "scatter_gather"

# ADuCM

[[sections]]
title = "ADuCM Platform"
level = 2
required = false
instruction = "This section should only be used to determine if the example project supports the ADuCM platform as determined by analyzing the 'builds.json' file."
content_structure = "Only the section heading and no other content"
section_creation_method = "scatter_gather"

[[sections]]
title = "Used Hardware"
level = 4
instruction = "List the the {DEVICE_EVAL_BOARD} eval board and {ADUCM_EVAL_BOARD} eval board.  The resulting list should show only the evaluation board model number and not include a description.  A correct example is as follows: EVAL-ABC-1234.  Do not include variations of the same model number."
content_structure = "Nothing more than a bulleted list including each eval board and a link to the product webpage if available.  The resulting list should show only the evaluation board model number and not include a description.  A correct example is as follows: EVAL-ABC-1234.  Do not include variations of the same model number."
section_creation_method = "scatter_gather"
committed_with = "ADuCM Platform"

[[sections]]
title = "Connections"
level = 4
instruction = "Provide detailed connection information between the {DEVICE_EVAL_BOARD} board and the {ADUCM_EVAL_BOARD} evaluation board required to run the example project."
content_structure = "A table showing connections between the {DEVICE_EVAL_BOARD} board and the {ADUCM_EVAL_BOARD} evaluation board, with pin numbers for each board, connection Mnemonic, and pin functions functions clearly indicated in separate columns."
section_creation_method = "scatter_gather"
committed_with = "ADuCM Platform"

[[sections]]
title = "Build Command"
level = 4
instruction = "Provide the specific build commands needed to compile the project for the ADUCM platform. Include commands for cleaning, building, flashing, and debugging."
content_structure = "A code block with the exact commands to run, with brief explanations if necessary.  Use no more than a single code block"
section_creation_method = "scatter_gather"
committed_with = "ADuCM Platform"

