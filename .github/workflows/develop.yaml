name: Backend Dev and Ops Deployment
on:
  push:
    branches: ["develop", "jgoegelin/dri-774-python-backend-cd"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
