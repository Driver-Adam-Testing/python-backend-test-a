[project]
name = "auth0-sync"
version = "0.1.0"
description = ""
authors = [
    {name = "Andrew Mark",email = "andrewemark@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.poetry.dependencies]
database = {path = "../../driver_db", develop = true}
