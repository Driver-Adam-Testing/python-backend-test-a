[tool.poetry]
name = "onboarding-event-handler"
version = "0.1.0"
description = ""
authors = ["Eric Miller <146128069+eric-driverai@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.34.130"
httpx = "^0.27.0"
pydantic = "^2.7.4"
pydantic-settings = "^2.3.3"


[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
