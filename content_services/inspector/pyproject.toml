[tool.poetry]
name = "inspector"
version = "0.1.0"
description = ""
authors = ["Andrew Mark <andrewemark@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src.inspection" },
    { include = "src.utils" },
    { include = "src.onboarding" },
]

# Note: this file is just used to create the venv for the local ide. Modal installs the dependencies for the containers
[tool.poetry.dependencies]
python = ">=3.12,<3.13"
openai = "^1.30.1"
tiktoken = "^0.7.0"
tqdm = "^4.66.4"
boto3 = "^1.34.114"
database = { path = "../../driver_db", develop = true }
pydantic = "^2.8.2"
shared = { path = "../../packages/shared", develop = true }
chardet = "^5.2.0"
requests = "^2.32.3"
sendgrid = "^6.11.0"
pyjwt = "^2.10.1"
httpx = "^0.28.1"
tree-sitter = "0.24.0"
tree-sitter-c = "0.23.4"
tree-sitter-cpp = "0.23.2"
tree-sitter-python = "^0.23.6"
tree-sitter-java = "^0.23.5"
tree-sitter-c-sharp = "^0.23.1"
tree-sitter-typescript = "^0.23.2"
modal = "^1.0.4"
aiolimiter = "^1.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
moto = "^5.0.9"
pytest-asyncio = "^0.23.7"
python-dotenv = "^1.0.1"
ipython = "^8.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
