[project]
name = "shared"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<3.13"
dependencies = [
    "markdown>=3.6",
    "database",
    "tiktoken>=0.12.0",
    "anthropic>=0.31.2",
    "boto3>=1.34.149",
    "pymupdf>=1.24.9",
    "tabula-py>=2.9.3",
    "rank-bm25>=0.2.2",
    "openai==1.99.1",
    "modal>=1.0.4",
    "pydantic[email]>=2.11.7",
    "auth0-python>=4.7.1",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
database = { workspace = true }

[tool.poetry]
name = "shared"
version = "0.1.0"
description = ""
authors = ["Neil Zumwalde <neilzumwalde@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
database = { path = "../driver_db", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.24.0"
