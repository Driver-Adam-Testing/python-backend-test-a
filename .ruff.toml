# .ruff.toml
line-length = 88
target-version = "py312"
fix = true

exclude = ["content_services/inspector/src/utils/treesitter_drivers/treesitter_testcases/"]

[lint]
select = ["E", "W", "F", "I", "C90", "ANN"]  # Common rulesets including E (errors), W (warnings), F (flake8), I (imports)

extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ERA", # flake8-eradicate/eradicate
    "PIE", # flake8-pie
    "PGH", # pygrep
    "RUF", # ruff checks
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
]

ignore = [
    "B008", # Ignore warning about using function calls as default arguments, common in FastAPI
    "T201", # print() found
    "ERA", # do not autoremove commented out code
    "B904", # use 'raise ... from err'
    "B905", # use explicit 'strict=' parameter with 'zip()'
    "N818", # Exception name should be named with an Error suffix
    "E501",
    "PGH003", # Allow generic type ignores
    "C901", # Don't check for 'too complex'
    "ANN101", # Ignore missing type annotation for self
    "ANN102", # Ignore missing type annotation for cls
    "C408", # Ignore Unnecessary `tuple` call (rewrite as a literal)
]

unfixable = [
    "ERA", # do not autoremove commented out code
]


[lint.per-file-ignores]
# Ignore N999 errors specifically for Alembic migration files.
"driver_db/database/alembic/versions/*.py" = ["N999"]
