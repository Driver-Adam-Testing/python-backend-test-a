[tool.poetry]
packages = [
    {include = "auth0_sync", from = "src"},
    {include = "event_processor", from = "src"}
]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
