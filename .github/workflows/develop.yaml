name: Backend Dev Deployment
on:
  push:
    branches: ["develop"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
jobs:
  # TODO:
  # unittest:
  #   runs-on: ubuntu-latest
  #   environment: development
  # integrationTest:
  development:
    # needs: unittest
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Install dependencies without virtualenv
        run: poetry install --no-root
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_CICD_ROLE }}
      - name: CDK Deploy
        env:
          DEPLOYMENT_ENVIRONMENT: development
        run: poetry run npx cdk deploy --require-approval never
      - name: Deploy Codebase Onboarding
        working-directory: content_services/onboarding
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENV: ${{ vars.MODAL_ENV }}
        run: poetry install --no-root && poetry run modal deploy --env=$MODAL_ENV --tag=${GITHUB_SHA::8} src/main.py
      # - name: Deploy Inspector
      #   working-directory: content_services/inspector
      #   env:
      #     MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      #     MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      #     MODAL_ENV: ${{ vars.MODAL_ENV }}
      #   run: poetry install --no-root && poetry run modal deploy --env=$MODAL_ENV --tag=${GITHUB_SHA::8} src/main.py
      - id: InspectorModalDeploy
        name: Deploy Inspector
        uses: ./.github/actions/modal-deploy
        with:
          working-directory: content_services/inspector
          package-name: Inspector
          modal-token-id: ${{ secrets.MODAL_TOKEN_ID }}
          modal-token-secret: ${{ secrets.MODAL_TOKEN_SECRET }}
          modal-env: ${{ vars.MODAL_ENV }}
      - name: Deploy PDF Preprocessing
        working-directory: content_services/pdf_preprocessing
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENV: ${{ vars.MODAL_ENV }}
        run: poetry install --no-root && poetry run modal deploy --env=$MODAL_ENV --tag=${GITHUB_SHA::8} src/main.py
      - name: Deploy Comprehender
        working-directory: content_services/comprehender
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENV: ${{ vars.MODAL_ENV }}
        run: poetry install --no-root && poetry run modal deploy --env=$MODAL_ENV --tag=${GITHUB_SHA::8} src/main.py
