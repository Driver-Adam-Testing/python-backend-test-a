content_structure = "A single paragraph that mentions the {DEVICE_EVAL_BOARD} board by name."

[[sections]]
title = "Connections"
level = 2
required = true
instruction = "Provide detailed descriptions of the pins on key connectors of the {DEVICE_EVAL_BOARD}. Include pin numbers, names, and functions for each connector. Describe only the {DEVICE_EVAL_BOARD} board connectors that users will interact with, not the internal pins of the {DEVICE} itself.  Mention the {DEVICE_EVAL_BOARD} board by name.  Use only the {DEVICE_EVAL_BOARD} user guide as a source of information and do not include any platform specific details.  The description should be a short sentence or two describing the function of the pin."
content_structure = "Organize the list of pins and related attributes in a single table.  The table should include the following columns: Pin Number, Pin Name, Pin Function, and Description.  If a pin is not used, it should be marked as 'Not Used' in the table.  The table should be preceded by a single sentence describing the purpose of the table.  This sentence should mention the {DEVICE_EVAL_BOARD} by name.  Include no other content beyond the introductory sentence and the table."

