# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: 'content_services/inspector/uctags-2024.10.02-linux-x86_64/.*'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    # Ruff version.
    rev: v0.6.5
    hooks:
      # Run the linter.
      - id: ruff
        args: ["--fix", "--config", ".ruff.toml"]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      - id: propagate-deps-updates
        name: Check pyproject.toml and lock files and propagate updates to parent projects
        entry: bash deps-pre-commit.sh
        language: system
        files: ^.*(pyproject\.toml)$

