version: "3.8"

services:
  gitlab:
    image: gitlab/gitlab-ee:17.3.5-ee.0
    platform: linux/amd64
    container_name: gitlab
    restart: always
    hostname: gitlab.local
    ports:
      - "80:80"
      - "443:443"
      - "22:22"
    volumes:
      - "$GITLAB_HOME/config:/etc/gitlab"
      - "$GITLAB_HOME/logs:/var/log/gitlab"
      - "$GITLAB_HOME/data:/var/opt/gitlab"
    environment:
        GITLAB_ROOT_PASSWORD: "some secure password"
