content_structure = "Include only the EXACT text: 'Please see: https://wiki.analog.com/resources/no-os/build' for this section."

[[sections]]
title = "No-OS Supported Examples"
level = 1
required = true
instruction = "Provide an overview for each example in the examples directory of the code. First explain where initialization data can be found in the project directory (typically Project Common Data Path) and where the platform specific macros are defined in the code (typically in platform specific files). Then identify all examples that exist in the project's example directory. For each example found, create a subsection that: 1) Describes what the example does and what functionality it demonstrates, 2) Explains how to enable/select the example by setting variables in the Makefile."
content_structure = """Start with an brief introductory paragraph about where example initialization data is found and where macros are defined.  This paragraph should take the following form:

'The initialization data used in the examples is taken out from: <Project Common Data Path>
The macros used in Common Data are defined in platform specific files found in: <Project Platform Configuration Path>'

Then include subsections (level 2 headings) for each specific example found in the project's example directory. Each example subsection should have 1-2 sentences of description followed by a code block showing how to enable that example and disable the other examples."""


[[sections]]
title = "Basic Example"
level = 2
required = true
instruction = """Describe how the basic example works in a single short paragraph followed by the exact 'instructions' as shown below:

<instructions>
In order to build the basic example, make sure you have the following configuration in the Makefile:

```
# Select the example you want to enable by choosing y for enabling and n for disabling
BASIC_EXAMPLE = y
IIO_EXAMPLE = n
```
</instructions>

"""
content_structure = "A single, short paragraph describing how the basic example works, followed by the exact 'instructions' shown above."

