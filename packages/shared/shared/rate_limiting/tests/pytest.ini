[pytest]
# Pytest configuration for rate limiting tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -ra
    --strict-markers
    --showlocals
    --tb=short

# Markers
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')

# Test paths
testpaths = .
