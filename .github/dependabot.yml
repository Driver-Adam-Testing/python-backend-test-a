version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: &default_schedule
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: ⬆
  # Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule: *default_schedule
    commit-message:
      prefix: ⬆
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule: *default_schedule
    commit-message:
      prefix: ⬆
  - package-ecosystem: "pip"
    directory: "/content_services/onboarding_event_handler"
    schedule: *default_schedule
    commit-message:
      prefix: ⬆
  - package-ecosystem: "pip"
    directory: "/content_services/onboarding"
    schedule: *default_schedule
    commit-message:
      prefix: ⬆
  - package-ecosystem: "pip"
    directory: "/driver_db"
    schedule: *default_schedule
    commit-message:
      prefix: ⬆
  - package-ecosystem: "pip"
    directory: "/content_services/inspector"
    schedule: *default_schedule
    commit-message:
      prefix: ⬆
  - package-ecosystem: "pip"
    directory: "/packages/shared"
    schedule: *default_schedule
    commit-message:
      prefix: ⬆
