name: Dependabot Auto Update
# Updates downstream packages when dependabot updates one

on:
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:
  update_lock_files:
    if: ${{ github.actor == 'dependabot[bot]' || github.actor == 'dependabot-preview[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version

      - name: Install Required Python Packages
        run: |
          pip install toml

      - name: Update Interdependent Packages
        run: |
          python update_interdependent_packages.py

      - name: Commit and Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update interdependent packages and lock files" || echo "No changes to commit"
          git push origin ${{ github.head_ref }}
