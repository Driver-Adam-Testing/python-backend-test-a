[tool.poetry]
name = "autodocs"
version = "0.1.0"
description = ""
authors = ["Shane Ghiotto <shane.ghiotto@driverai.com>"]
packages = [
    { include = "src/utils" },
]

# Note: this file is just used to create the venv for the local ide. Modal installs the dependencies for the containers
[tool.poetry.dependencies]
python = "^3.12"
openai = "^1.30.1"
tiktoken = "^0.7.0"
