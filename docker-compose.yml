services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
  #  db-initializer:
  #    image: db-init
  #    build:
  #      context: ./driver_db
  #    depends_on:
  #      - db
  #    env_file:
  #      - .env
  #    environment:
  #      - POSTGRES_SERVER=db
  #      - POSTGRES_PORT=${POSTGRES_PORT}
  #      - POSTGRES_DB=${POSTGRES_DB}
  #      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
  #      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
  ##      - NEW_API_USERNAME=localapi
  ##      - NEW_API_PASSWORD=localapi
  backend:
    platform: linux/arm64
    image: "backend:latest"
    ports:
      - "8888:8888"
    volumes:
      - ./backend/:/app
      - ./driver_db/:/driver_db
      - ./packages/:/packages
    build:
      dockerfile: ./Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV-true}
    networks:
      - default
    depends_on:
      - db
    #      - db-initializer
    env_file:
      - .env
    environment:
      - ENVIRONMENT=local
      - PYTHONPATH=/app
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}

      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_MGMT_API_CLIENT_ID=${AUTH0_MGMT_API_CLIENT_ID}
      - AUTH0_MGMT_API_CLIENT_SECRET=${AUTH0_MGMT_API_CLIENT_SECRET}
      - AUTH0_MGMT_API_AUDIENCE=${AUTH0_MGMT_API_AUDIENCE}
      - AWS_REGION=${AWS_REGION?Variable not set}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID?Variable not set}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY?Variable not set}
      - PORT=8888
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID?Variable not set}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET?Variable not set}
      - MODAL_ENVIRONMENT=${MODAL_ENVIRONMENT?dev}
      - INSTALL_DEV=true
      - INSPECTOR_BUCKET_NAME=${INSPECTOR_BUCKET_NAME?Variable not set}
      - DROPZONE_BUCKET_NAME=${DROPZONE_BUCKET_NAME?Variable not set}
volumes:
  app-db-data:
